# configs/boosting/v1_default.yaml
name: "boosting_v1_default"
results_root: "experiments/boosting/v1_default"
random_state: 42
cross_validation: true
cv_folds: 5
save_models: true
cache_predictions: true

data:
  path: "data/raw/Friday-DDos.pcap_ISCX.csv"
  train_ratio: 0.8
  remove_leakage: true
  cache_processed: true
  cache_dir: "data/processed"

models:
  XGBoost:
    enabled: true
    use_scaler: false
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1
      
  CatBoost:
    enabled: true
    use_scaler: false
    params:
      iterations: 100
      depth: 6
      learning_rate: 0.1
      random_seed: 42
      verbose: false
      
  LightGBM:
    enabled: true
    use_scaler: false
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      num_leaves: 31
      random_state: 42
      n_jobs: -1
      
  LogisticRegression:
    enabled: true
    use_scaler: true
    params:
      max_iter: 1000
      n_jobs: -1
      random_state: 42