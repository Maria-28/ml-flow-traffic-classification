# configs/baseline/baseline_models.yaml
name: "baseline_comparison"
random_state: 42
cross_validation: true
cv_folds: 5
save_models: true
cache_predictions: true

data:
  path: "data/raw/Friday-DDos.pcap_ISCX.csv"
  train_ratio: 0.8
  remove_leakage: true
  cache_processed: true
  cache_dir: "data/processed"

models:
  LogisticRegression:
    enabled: true
    use_scaler: true
    params:
      max_iter: 1000
      n_jobs: -1
      random_state: 42
      
  DecisionTree:
    enabled: true
    use_scaler: false
    params:
      max_depth: 10
      min_samples_split: 20
      random_state: 42
      
  RandomForest:
    enabled: true
    use_scaler: false
    params:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 20
      n_jobs: -1
      random_state: 42