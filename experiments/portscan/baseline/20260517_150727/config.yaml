name: portscan_baseline
random_state: 42
cross_validation: true
cv_folds: 5
save_models: true
cache_predictions: true
results_root: experiments/portscan/baseline
data:
  path: data/raw/Friday-PortScan.pcap_ISCX.csv
  train_ratio: 0.8
  remove_leakage: true
  cache_processed: true
  cache_dir: data/processed
  expected_labels:
  - BENIGN
  - PortScan
models:
  LogisticRegression:
    enabled: true
    use_scaler: true
    params:
      max_iter: 1000
      n_jobs: -1
      random_state: 42
      class_weight: balanced
  XGBoost:
    enabled: true
    use_scaler: false
    params:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.1
      random_state: 42
      n_jobs: -1
      eval_metric: logloss
      verbosity: 0
  CatBoost:
    enabled: true
    use_scaler: false
    params:
      iterations: 500
      depth: 6
      learning_rate: 0.1
      random_seed: 42
      verbose: false
      auto_class_weights: Balanced
